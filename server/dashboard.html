<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outreach CRM</title>
  <style>
    :root{color-scheme:dark;font:14px system-ui,sans-serif;background:#111827;color:#e5e7eb}body{margin:0;padding:24px;max-width:1400px;margin-inline:auto}h1{margin:0 0 6px}p{color:#9ca3af}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:14px 18px;min-width:115px}.card b{display:block;font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,select,button{background:#111827;color:#e5e7eb;border:1px solid #4b5563;border-radius:7px;padding:9px}button{cursor:pointer;background:#2563eb;border-color:#2563eb}button.secondary{background:#374151;border-color:#4b5563}button:disabled{cursor:not-allowed;opacity:.55}#gmailStatus{align-self:center;color:#9ca3af}#gmailStatus[data-state="connected"]{color:#86efac}#gmailStatus[data-state="error"]{color:#fca5a5}table{width:100%;border-collapse:collapse;background:#1f2937;border-radius:10px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid #374151;vertical-align:top}th{color:#9ca3af;font-size:12px;text-transform:uppercase}td small{display:block;color:#9ca3af;margin-top:4px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#374151}.due{color:#fbbf24}.empty{padding:30px;text-align:center;color:#9ca3af}@media(max-width:800px){body{padding:14px}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
</head>
<body>
  <h1>Outreach CRM</h1><p>Local tracker for sent emails, replies, follow-ups, and job metadata.</p>
  <div class="toolbar"><span id="gmailStatus" aria-live="polite" data-state="checking">Checking Gmail connection…</span><button id="connectGmail" type="button">Connect Gmail</button><button class="secondary" id="syncGmail" type="button" disabled>Sync now</button><button class="secondary" id="disconnectGmail" type="button" disabled>Disconnect</button></div>
  <section class="cards" id="cards"></section>
  <div class="toolbar"><input id="q" placeholder="Search email, company, role…"><select id="status"><option value="">All statuses</option><option>new</option><option>sent</option><option>followed_up</option><option>replied</option><option>interview</option><option>rejected</option><option>bounced</option><option>closed</option></select><button id="refresh">Refresh</button><button class="secondary" id="due">Due follow-ups</button></div>
  <table><thead><tr><th>Contact</th><th>Role / company</th><th>Status</th><th>Last activity</th><th>Next follow-up</th></tr></thead><tbody id="rows"></tbody></table>
  <script>
    const $=id=>document.getElementById(id); let dueOnly=false;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function setBusy(id,busy,label){const button=$(id);button.disabled=busy;button.setAttribute('aria-busy',String(busy));if(label)button.textContent=label}
    function renderGmailStatus(s){const connected=Boolean(s.connected);$('gmailStatus').dataset.state=connected?'connected':s.configured?'ready':'error';$('gmailStatus').textContent=connected?`Gmail connected: ${s.email||'account'}${s.lastSyncAt?` · Last sync ${s.lastSyncAt}`:''}`:(s.configured?'Gmail is ready to connect.':'Set OEH_GOOGLE_CLIENT_ID and OEH_GOOGLE_CLIENT_SECRET to enable Gmail login.');$('connectGmail').textContent=connected?'Reconnect Gmail':'Connect Gmail';$('syncGmail').textContent='Sync now';$('disconnectGmail').textContent='Disconnect';$('syncGmail').disabled=!connected;$('disconnectGmail').disabled=!connected}
    async function gmailStatus(){try{const r=await fetch('/auth/gmail/status',{cache:'no-store'});if(!r.ok)throw new Error('Status request failed');const s=await r.json();renderGmailStatus(s);return s}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Gmail status unavailable.';$('syncGmail').disabled=true;$('disconnectGmail').disabled=true;return null}}
    async function load(){try{const p=new URLSearchParams();if($('q').value)p.set('query',$('q').value);if($('status').value)p.set('status',$('status').value);if(dueOnly)p.set('due','true');const [summaryResponse,rowsResponse]=await Promise.all([fetch('/outreach/summary',{cache:'no-store'}),fetch('/outreach?'+p,{cache:'no-store'})]);if(!summaryResponse.ok||!rowsResponse.ok)throw new Error('Outreach data request failed');const s=await summaryResponse.json();const r=await rowsResponse.json();$('cards').innerHTML=Object.entries({...s.counts,total:s.total,due:s.due}).map(([k,v])=>`<div class="card"><b>${escapeHtml(v)}</b>${escapeHtml(k)}</div>`).join('');$('rows').innerHTML=r.length?r.map(x=>`<tr><td><b>${escapeHtml(x.name||'—')}</b><small>${escapeHtml(x.email)}</small></td><td>${escapeHtml(x.role||'—')}<small>${escapeHtml(x.company||'')}</small></td><td><span class="pill">${escapeHtml(x.status)}</span></td><td>${last(x)}</td><td class="${x.nextFollowUpAt&&x.nextFollowUpAt.slice(0,10)<=new Date().toISOString().slice(0,10)?'due':''}">${escapeHtml(x.nextFollowUpAt||'—')}</td></tr>`).join(''):'<tr><td class="empty" colspan="5">No outreach records yet.</td></tr>'}catch(e){$('rows').innerHTML='<tr><td class="empty" colspan="5">Unable to load outreach records.</td></tr>'}await gmailStatus()}
    function last(x){const e=(x.events||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return e?`${escapeHtml(e.type)}<small>${escapeHtml(e.at)}</small>`:'—'}
    $('refresh').onclick=load;$('connectGmail').onclick=()=>{setBusy('connectGmail',true,'Opening Gmail…');window.location.href='/auth/gmail/start'};$('syncGmail').onclick=async()=>{setBusy('syncGmail',true,'Syncing…');try{const r=await fetch('/outreach/sync',{method:'POST'});if(!r.ok)throw new Error('Gmail sync failed');await load()}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Gmail sync failed. Try again.';await gmailStatus()}finally{if($('syncGmail').disabled===false)setBusy('syncGmail',false,'Sync now')}};$('disconnectGmail').onclick=async()=>{setBusy('disconnectGmail',true,'Disconnecting…');try{const r=await fetch('/auth/gmail/disconnect',{method:'POST'});if(!r.ok)throw new Error('Disconnect failed');await load()}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Could not disconnect Gmail.';await gmailStatus()}finally{if($('disconnectGmail').disabled===true)$('disconnectGmail').textContent='Disconnect'}};$('due').onclick=()=>{dueOnly=!dueOnly;$('due').textContent=dueOnly?'All contacts':'Due follow-ups';load()};$('q').oninput=load;$('status').onchange=load;load();setInterval(load,30000);setInterval(gmailStatus,5000);
  </script>
</body></html>
