<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outreach CRM</title>
  <style>
    :root{color-scheme:dark;font:14px system-ui,sans-serif;background:#111827;color:#e5e7eb}body{margin:0;padding:24px;max-width:1400px;margin-inline:auto}h1{margin:0 0 6px}p{color:#9ca3af}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:14px 18px;min-width:115px}.card b{display:block;font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,select,button{background:#111827;color:#e5e7eb;border:1px solid #4b5563;border-radius:7px;padding:9px}button{cursor:pointer;background:#2563eb;border-color:#2563eb}button.secondary{background:#374151;border-color:#4b5563}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}#gmailStatus{align-self:center;color:#9ca3af}#gmailStatus[data-state="connected"]{color:#86efac}#gmailStatus[data-state="error"]{color:#fca5a5}.tabs{display:flex;gap:8px;border-bottom:1px solid #374151;margin:24px 0 16px}.tabs button{background:transparent;border:0;border-radius:0;color:#9ca3af;padding:12px 16px}.tabs button[aria-selected="true"]{color:#fff;border-bottom:2px solid #60a5fa}.panel[hidden]{display:none}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#1f2937;border-radius:10px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid #374151;vertical-align:top}th{color:#9ca3af;font-size:12px;text-transform:uppercase}td small{display:block;color:#9ca3af;margin-top:4px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#374151}.due{color:#fbbf24}.empty{padding:30px;text-align:center;color:#9ca3af}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:12px 0;color:#cbd5e1}@media(max-width:800px){body{padding:14px}.cards{gap:8px}.card{min-width:78px;flex:1}table{font-size:12px}th,td{padding:8px}}
  </style>
</head>
<body>
  <h1>Outreach CRM</h1><p>Local tracker for sent emails, replies, follow-ups, and job metadata.</p>
  <div class="toolbar"><span id="gmailStatus" aria-live="polite" data-state="checking">Checking Gmail connection…</span><button id="connectGmail" type="button">Connect Gmail</button><button class="secondary" id="syncGmail" type="button" disabled>Sync now</button><button class="secondary" id="disconnectGmail" type="button" disabled>Disconnect</button></div>
  <section class="cards" id="cards"></section>
  <nav class="tabs" aria-label="Dashboard sections"><button id="outreachTab" role="tab" aria-selected="true" aria-controls="outreachPanel">Outreach <span id="outreachCount"></span></button><button id="contactsTab" role="tab" aria-selected="false" aria-controls="contactsPanel">Harvested contacts <span id="contactsCount"></span></button></nav>
  <section class="panel" id="outreachPanel" role="tabpanel" aria-labelledby="outreachTab"><div class="toolbar"><input id="q" aria-label="Search outreach" placeholder="Search person, email, company, role"><select id="status" aria-label="Filter by response"><option value="">All responses</option><option value="awaiting">No reply yet</option><option value="replied">Replied</option><option value="interview">Interview</option><option value="rejected">Rejected</option><option value="bounced">Delivery failed</option><option value="sent">Sent / followed up</option></select><button id="refresh">Refresh</button><button class="secondary" id="due">Due follow-ups</button><label>Rows <select id="outreachPageSize" aria-label="Outreach rows per page"><option>10</option><option>25</option><option>50</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Contact</th><th>Role / company</th><th>What happened</th><th>Last email</th><th>Interview link</th><th>Next follow-up</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="outreachPageInfo" aria-live="polite"></span><button class="secondary" id="outreachPrev">Previous</button><button class="secondary" id="outreachNext">Next</button></div></section>
  <section class="panel" id="contactsPanel" role="tabpanel" aria-labelledby="contactsTab" hidden><p>Page-scanned contacts synced from your browser extension.</p><div class="toolbar"><input id="contactQ" aria-label="Search harvested contacts" placeholder="Search email, name, domain or source"><select id="contactType" aria-label="Filter contact type"><option value="">All types</option><option value="email">Emails</option><option value="phone">Phones</option><option value="social">Social links</option></select><button class="secondary" id="contactRefresh">Refresh</button><label>Rows <select id="contactPageSize" aria-label="Contact rows per page"><option>10</option><option>25</option><option>50</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Value</th><th>Type</th><th>Domain</th><th>Source page</th><th>Validity</th></tr></thead><tbody id="contactRows"></tbody></table></div><div class="pagination"><span id="contactPageInfo" aria-live="polite"></span><button class="secondary" id="contactPrev">Previous</button><button class="secondary" id="contactNext">Next</button></div></section>
  <script>
    const $=id=>document.getElementById(id); let dueOnly=false,outreachData=[],contactData=[],outreachPage=1,contactPage=1;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function setBusy(id,busy,label){const button=$(id);button.disabled=busy;button.setAttribute('aria-busy',String(busy));if(label)button.textContent=label}
    function renderGmailStatus(s){const connected=Boolean(s.connected);$('gmailStatus').dataset.state=connected?'connected':s.configured?'ready':'error';$('gmailStatus').textContent=connected?`Gmail connected: ${s.email||'account'}${s.lastSyncAt?` · Last sync ${s.lastSyncAt}`:''}`:(s.configured?'Gmail is ready to connect.':'Set OEH_GOOGLE_CLIENT_ID and OEH_GOOGLE_CLIENT_SECRET to enable Gmail login.');$('connectGmail').textContent=connected?'Reconnect Gmail':'Connect Gmail';$('syncGmail').textContent='Sync now';$('disconnectGmail').textContent='Disconnect';$('syncGmail').disabled=!connected;$('disconnectGmail').disabled=!connected}
    async function gmailStatus(){try{const r=await fetch('/auth/gmail/status',{cache:'no-store'});if(!r.ok)throw new Error('Status request failed');const s=await r.json();renderGmailStatus(s);return s}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Gmail status unavailable.';$('syncGmail').disabled=true;$('disconnectGmail').disabled=true;return null}}
    function pageWindow(data,page,size){const pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(Math.max(1,page),pages);return {items:data.slice((page-1)*size,page*size),page,pages,start:data.length?(page-1)*size+1:0,end:Math.min(page*size,data.length)}}
    function responseState(x){if(x.status==='interview'||x.status==='rejected'||x.status==='bounced'||x.status==='replied')return x.status;if(x.lastInboundAt)return 'replied';return 'awaiting'}
    function renderOutreach(){const q=$('q').value.trim().toLowerCase(),status=$('status').value;const filtered=outreachData.filter(x=>(!status||(status==='sent'?['sent','followed_up'].includes(x.status):responseState(x)===status))&&(!dueOnly||(x.nextFollowUpAt&&x.nextFollowUpAt.slice(0,10)<=new Date().toISOString().slice(0,10)&&!['closed','rejected'].includes(x.status)))&&(!q||JSON.stringify(x).toLowerCase().includes(q)));const size=Number($('outreachPageSize').value),p=pageWindow(filtered,outreachPage,size);outreachPage=p.page;$('rows').innerHTML=p.items.length?p.items.map(x=>{const event=(x.events||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];const state=responseState(x);const link=x.interviewUrl||((x.events||[]).find(e=>e.interviewUrl)||{}).interviewUrl;const linkHtml=link&&/^https?:\/\//i.test(link)?`<a href="${escapeHtml(link)}" target="_blank" rel="noopener">Open interview link</a>`:'—';return `<tr><td><b>${escapeHtml(x.name||'—')}</b><small>${escapeHtml(x.email)}</small></td><td>${escapeHtml(x.role||'—')}<small>${escapeHtml(x.company||'')}</small></td><td><span class="pill">${escapeHtml(state==='awaiting'?'No reply yet':state==='bounced'?'Delivery failed':state)}</span></td><td>${event?`${escapeHtml(event.subject||event.type)}<small>${escapeHtml(event.at)}</small>`:'—'}</td><td>${linkHtml}</td><td class="${x.nextFollowUpAt&&x.nextFollowUpAt.slice(0,10)<=new Date().toISOString().slice(0,10)?'due':''}">${escapeHtml(x.nextFollowUpAt||'—')}</td></tr>`}).join(''):'<tr><td class="empty" colspan="6">No matching outreach records.</td></tr>';$('outreachPageInfo').textContent=`Showing ${p.start}–${p.end} of ${filtered.length}`;$('outreachPrev').disabled=p.page<=1;$('outreachNext').disabled=p.page>=p.pages;$('outreachCount').textContent=`(${filtered.length})`}
    function renderContacts(){const q=$('contactQ').value.trim().toLowerCase(),type=$('contactType').value;const filtered=contactData.filter(x=>(!type||x.type===type)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));const p=pageWindow(filtered,contactPage,Number($('contactPageSize').value));contactPage=p.page;$('contactRows').innerHTML=p.items.length?p.items.map(x=>{const value=x.email||x.phone||x.url||'—';const source=(x.sources||[])[0]||'';return `<tr><td><b>${escapeHtml(value)}</b><small>${escapeHtml(x.name||'')}</small></td><td><span class="pill">${escapeHtml(x.type||'')}</span></td><td>${escapeHtml(x.domain||'—')}</td><td>${escapeHtml(x.pageTitle||'—')}<small>${escapeHtml(source)}</small></td><td>${escapeHtml(x.validity||'—')}</td></tr>`}).join(''):'<tr><td class="empty" colspan="5">No matching contacts. Check that extension sync is enabled.</td></tr>';$('contactPageInfo').textContent=`Showing ${p.start}–${p.end} of ${filtered.length}`;$('contactPrev').disabled=p.page<=1;$('contactNext').disabled=p.page>=p.pages;$('contactsCount').textContent=`(${filtered.length})`}
    function render(){renderOutreach();renderContacts()}
    async function load(){try{const [summaryResponse,rowsResponse,contactsResponse]=await Promise.all([fetch('/outreach/summary',{cache:'no-store'}),fetch('/outreach',{cache:'no-store'}),fetch('/contacts',{cache:'no-store'})]);if(!summaryResponse.ok||!rowsResponse.ok||!contactsResponse.ok)throw new Error('Dashboard data request failed');const s=await summaryResponse.json();outreachData=await rowsResponse.json();contactData=await contactsResponse.json();const noReply=outreachData.filter(x=>responseState(x)==='awaiting').length;$('cards').innerHTML=[['Awaiting reply',noReply],['Interviews',outreachData.filter(x=>responseState(x)==='interview').length],['Rejected',outreachData.filter(x=>responseState(x)==='rejected').length],['Delivery failed',s.counts.bounced],['Follow-ups due',s.due],['Harvested contacts',contactData.length]].map(([k,v])=>`<div class="card"><b>${escapeHtml(v)}</b>${escapeHtml(k)}</div>`).join('');outreachPage=1;contactPage=1;render()}catch(e){$('rows').innerHTML='<tr><td class="empty" colspan="6">Unable to load dashboard records.</td></tr>';$('contactRows').innerHTML='<tr><td class="empty" colspan="5">Unable to load harvested contacts.</td></tr>'}await gmailStatus()}
    function last(x){const e=(x.events||[]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return e?`${escapeHtml(e.type)}<small>${escapeHtml(e.at)}</small>`:'—'}
    $('refresh').onclick=load;$('contactRefresh').onclick=load;$('connectGmail').onclick=()=>{setBusy('connectGmail',true,'Opening Gmail…');window.location.href='/auth/gmail/start'};$('syncGmail').onclick=async()=>{setBusy('syncGmail',true,'Syncing…');try{const r=await fetch('/outreach/sync',{method:'POST'});if(!r.ok)throw new Error('Gmail sync failed');await load()}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Gmail sync failed. Try again.';await gmailStatus()}finally{if($('syncGmail').disabled===false)setBusy('syncGmail',false,'Sync now')}};$('disconnectGmail').onclick=async()=>{setBusy('disconnectGmail',true,'Disconnecting…');try{const r=await fetch('/auth/gmail/disconnect',{method:'POST'});if(!r.ok)throw new Error('Disconnect failed');await load()}catch(e){$('gmailStatus').dataset.state='error';$('gmailStatus').textContent='Could not disconnect Gmail.';await gmailStatus()}finally{if($('disconnectGmail').disabled===true)$('disconnectGmail').textContent='Disconnect'}};$('due').onclick=()=>{dueOnly=!dueOnly;$('due').textContent=dueOnly?'All applications':'Due follow-ups';outreachPage=1;renderOutreach()};$('q').oninput=()=>{outreachPage=1;renderOutreach()};$('status').onchange=()=>{outreachPage=1;renderOutreach()};$('outreachPageSize').onchange=()=>{outreachPage=1;renderOutreach()};$('contactQ').oninput=()=>{contactPage=1;renderContacts()};$('contactType').onchange=()=>{contactPage=1;renderContacts()};$('contactPageSize').onchange=()=>{contactPage=1;renderContacts()};$('outreachPrev').onclick=()=>{outreachPage--;renderOutreach()};$('outreachNext').onclick=()=>{outreachPage++;renderOutreach()};$('contactPrev').onclick=()=>{contactPage--;renderContacts()};$('contactNext').onclick=()=>{contactPage++;renderContacts()};$('outreachTab').onclick=()=>{$('outreachPanel').hidden=false;$('contactsPanel').hidden=true;$('outreachTab').setAttribute('aria-selected','true');$('contactsTab').setAttribute('aria-selected','false')};$('contactsTab').onclick=()=>{$('outreachPanel').hidden=true;$('contactsPanel').hidden=false;$('outreachTab').setAttribute('aria-selected','false');$('contactsTab').setAttribute('aria-selected','true')};load();setInterval(load,30000);setInterval(gmailStatus,5000);
  </script>
</body></html>
